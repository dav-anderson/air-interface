[package]
name = "air-minterface"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "The code that operates the programs an AIR runs (spi and aso): run them, install and upgrade them from releases, schedule an upgrade, cap their logs."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Local time for a scheduled upgrade and its printed time zone (EDT, CET): the
# system zone, and a bundled zone database so a machine without one still works.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }

[lib]
name = "air_minterface"
path = "src/lib.rs"
